                        <!DOCTYPEdoctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>
      BANJARNEGARA - PETA PENGGUNAAN LAHAN (BERBASIS LEAFLET.js)
    </title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      /* Header Banner */
      .header-banner {
        background-color: #1a365d;
        color: white;
        text-align: center;
        padding: 10px 0;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 1px;
        height: 25px;
        line-height: 25px;
      }
      #map {
        height: calc(100% - 45px);
        width: 100%;
      }
      /* Kotak Info Koordinat */
      .info-box {
        background: white;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 18px;
        border-radius: 4px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        min-width: 180px;
      }
      .info-box h4 {
        margin: 0 0 5px 0;
        color: #333;
        font-size: 14px;
        border-bottom: 1px dashed #999;
        padding-bottom: 4px;
      }
      /* Style Label Teks di Peta */
      .landuse-label {
        background: rgba(255, 255, 255, 0);
        border: none;
        box-shadow: none;
        font-size: 11px;
        font-weight: bold;
        color: #111;
        text-shadow:
          -1px -1px 0 #fff,
          1px -1px 0 #fff,
          -1px 1px 0 #fff,
          1px 1px 0 #fff;
      }
    </style>
  </head>
  <body>
    <div class="header-banner">
      BANJARNEGARA - PETA PENGGUNAAN LAHAN (BERBASIS LEAFLET.js)
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></
